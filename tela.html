<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Eletrônico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="painel-ponto">
        <header class="topo-sistema">
            <div class="logo-container">
                <div class="ponto-indicador"></div>
                <img src="WhatsApp Image 2026-05-30 at 14.47.33.jpeg" alt="Logo Empresa" class="logo-img">
            </div>
            <h1>Bem-vindo ao Sistema de Ponto</h1>
            <p class="subtitulo">Controle de Jornada Semanal</p>
        </header>

        <main class="card-ponto">
            <div class="status-dia">
                <span class="data-atual">Hoje: <strong>30/05/2026</strong></span>
                <span class="badge-status">Aguardando Registro</span>
            </div>

            <form class="bloco-registro" id="form-entrada">
                <h3><span class="marcador entrada"></span>Registrar Entrada</h3>
                <div class="grupo-input">
                    <label for="hora-entrada">Horário de Chegada:</label>
                    <input type="time" id="hora-entrada" required>
                </div>
                <button type="button" class="btn-ponto btn-entrada">Bater Entrada</button>
            </form>

            <form class="bloco-registro" id="form-saida">
                <h3><span class="marcador saida"></span>Registrar Saída</h3>
                <div class="grupo-input">
                    <label for="hora-saida">Horário de Saída:</label>
                    <input type="time" id="hora-saida" required>
                </div>
                <button type="button" class="btn-ponto btn-saida">Bater Saída</button>
            </form>
        </main>

        <footer class="rodape">
            <p>Seus dados semanais serão enviados diretamente ao contratante.</p>
        </footer>
    </div>

</body>
</html>
